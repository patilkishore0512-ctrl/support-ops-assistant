# Golden set for the Support Ops Assistant.
#
# Written before any evaluation was run, against the text of the knowledge base, so the
# questions are not tuned to the system's results.
#
# Fields
#   id               unique id; prefix shows the category
#   category         docs_exact | docs_paraphrase | docs_filtered | unanswerable | tickets
#   question         what the user asks
#   expected_route   docs | tickets
#   expected_sources docs: retrieval counts as a hit if ANY of these files is retrieved
#   key_facts        docs: list of fact groups; a group is satisfied if ANY of its strings
#                    appears in the answer (case-insensitive). correctness = groups satisfied / groups
#   filters          optional metadata filters passed to /ask
#   expected_answer  tickets: values that must appear in the returned rows or answer
#   answerable       false -> the correct behaviour is "I don't know"
#
# docs_exact       uses the exact identifiers that appear in the docs (favours keyword search)
# docs_paraphrase  describes the problem in the user's own words, avoiding the docs' terms
#                  where possible (favours semantic search)
# Expected ticket values come from the Part A store built with seed 42.

questions:
  # ---------------- docs: exact identifiers ----------------
  - id: exact-01
    category: docs_exact
    question: What does allow_credentials do in CORSMiddleware and what is its default?
    expected_route: docs
    expected_sources: [fastapi/tutorial/cors.md]
    key_facts: [[cookies], ["false"]]

  - id: exact-02
