name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Unit and integration tests
        run: python -m pytest -q

      - name: Pipeline end to end
        run: |
          python -m pipeline generate --seed 42
          python -m pipeline run
          python -m pipeline run --day 2026-10-02 --force
          python -m pipeline report

      - name: RAG service end to end (offline models, mock LLM)
        env:
          EMBEDDING_BACKEND: lsa
          RERANKER_BACKEND: none
        run: |
          python -m rag_service ingest
          python -m rag_service serve --port 8000 &
          python scripts/smoke_test.py http://localhost:8000

      - name: Evaluation (offline configurations)
        run: python evaluation/run_eval.py --configs offline --out /tmp/eval

  docker:
    name: Docker image (with models) from a clean machine
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t support-ops-assistant .

      - name: Run container
        run: docker run -d --name api -p 8000:8000 support-ops-assistant

      - name: Smoke test
        run: python3 scripts/smoke_test.py http://localhost:8000

      - name: Container logs
        if: always()
        run: docker logs api | tail -50
